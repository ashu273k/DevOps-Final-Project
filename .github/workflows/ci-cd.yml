name: TaskBoard Python CI/CD

on:
  push:
    branches: main
  pull_request:
    branches: main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/taskboard-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/taskboard-frontend

permissions:
  contents: read

jobs:
  test:
    name: Test backend and build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  build-scan-push:
    name: Build, scan, and publish images
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        run: docker build -t "${BACKEND_IMAGE}:${GITHUB_SHA}" ./backend
      - name: Build frontend image
        run: docker build -t "${FRONTEND_IMAGE}:${GITHUB_SHA}" ./frontend
      - name: Scan backend image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/" \
            aquasec/trivy:0.65.0 \
            image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${BACKEND_IMAGE}:${GITHUB_SHA}"
      - name: Scan frontend image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/" \
            aquasec/trivy:0.65.0 \
            image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${FRONTEND_IMAGE}:${GITHUB_SHA}"
      - name: Push SHA-tagged images to GHCR
        run: |
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"
          docker push "${FRONTEND_IMAGE}:${GITHUB_SHA}"

